<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ESTUDIO 15 - INICIAR SESIÓN</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" />
<!-- 1. Global primero (variables, header, footer, carrito, page-hero) -->
<link rel="stylesheet" href="../global/global.css">
<!-- 2. Estilos exclusivos de esta página -->
<link rel="stylesheet" href="login.css">
</head>
<body>

<!-- ============================================================
     HEADER / NAVBAR — inyectado por global.js
     ============================================================ -->
<div id="site-header"></div>

<!-- ============================================================
     HERO SECUNDARIO (page-hero, definido en global.css)
     ============================================================ -->
<section class="page-hero">
  <div>
    <span class="page-hero-tag"><span class="dot"></span> Tu cuenta</span>
    <h1 class="page-hero-title">INICIA<span class="accent-gradient">SESIÓN</span></h1>
    <p class="page-hero-desc">Entra para ver tus citas, tu historial de compras y gestionar tu cuenta en Estudio 15.</p>
  </div>
</section>

<!-- ============================================================
     FORMULARIO DE LOGIN — exclusivo de esta página (login.css)
     ============================================================ -->
<section class="login-section">
  <form class="form">
    <div class="flex-column">
      <label>Usuario</label>
    </div>
    <div class="inputForm">
      <i data-lucide="id-card" class="inputForm-icon"></i>
      <input type="text" id="login-cedula" class="input" placeholder="Tu cédula (clientes) o código de puesto (empleados)">
    </div>

    <div class="flex-column">
      <label>Contraseña</label>
    </div>
    <div class="inputForm">
      <i data-lucide="lock" class="inputForm-icon"></i>
      <input type="password" id="login-password" class="input" placeholder="Escribe tu contraseña">
      <button type="button" class="toggle-password-btn" id="toggle-login-password" aria-label="Mostrar contraseña">
        <i data-lucide="eye" class="icon-show"></i>
        <i data-lucide="eye-off" class="icon-hide"></i>
      </button>
    </div>

    <div class="flex-row">
      <div>
        <input type="checkbox" id="remember-me">
        <label for="remember-me">Recuérdame</label>
      </div>
      <span class="span">¿Olvidaste tu contraseña?</span>
    </div>

    <button type="submit" class="button-submit">Iniciar sesión</button>
    <p class="login-error" id="login-error"></p>

    <p class="p">¿No tienes cuenta? <a href="../register/register.html" class="span">Regístrate</a></p>
  </form>
</section>

<!-- ============================================================
     FOOTER — inyectado por global.js
     ============================================================ -->
<div id="site-dashboard-footer"></div>

<!-- ============================================================
     CARRITO DE COMPRAS — inyectado por global.js
     ============================================================ -->
<div id="site-cart"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/lucide-static/0.378.0/umd/lucide.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../global/supabase-client.js"></script>
<script src="../global/payment-info.js"></script>
<script src="../global/auth.js"></script>
<script src="../global/global.js"></script>
<script src="login.js"></script>

</body>
</html>
