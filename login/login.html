<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ESTUDIO 15 - INICIAR SESIÓN</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

<body>

<!-- ============================================================
     HEADER / NAVBAR — inyectado por global.js
     ============================================================ -->
<div id="site-header"></div>

<!-- ============================================================
     HERO SECUNDARIO (page-hero, definido en global.css)
     ============================================================ -->
<section class="page-hero">
  <div>
    <span class="page-hero-tag"><span class="dot"></span> Tu cuenta</span>
    <h1 class="page-hero-title">INICIA<span class="accent-gradient">SESIÓN</span></h1>
    <p class="page-hero-desc">Entra para ver tus citas, tu historial de compras y gestionar tu cuenta en Estudio 15.</p>
  </div>
</section>

<!-- ============================================================
     FORMULARIO DE LOGIN — exclusivo de esta página (login.css)
     ============================================================ -->
<section class="login-section">
  <form class="form">
    <div class="flex-column">
      <label>Email</label>
    </div>
    <div class="inputForm">
      <svg height="20" viewBox="0 0 32 32" width="20" xmlns="http://www.w3.org/2000/svg"><g id="Layer_3" data-name="Layer 3"><path d="m30.853 13.87a15 15 0 0 0 -29.729 4.082 15.1 15.1 0 0 0 12.876 12.918 15.6 15.6 0 0 0 2.016.13 14.85 14.85 0 0 0 7.715-2.145 1 1 0 1 0 -1.031-1.711 13.007 13.007 0 1 1 5.458-6.529 2.149 2.149 0 0 1 -4.158-.759v-10.856a1 1 0 0 0 -2 0v1.726a8 8 0 1 0 .2 10.325 4.135 4.135 0 0 0 7.83.274 15.2 15.2 0 0 0 .823-7.455zm-14.853 8.13a6 6 0 1 1 6-6 6.006 6.006 0 0 1 -6 6z"></path></g></svg>
      <input type="text" class="input" placeholder="Escribe tu correo">
    </div>

    <div class="flex-column">
      <label>Contraseña</label>
    </div>
    <div class="inputForm">
      <svg height="20" viewBox="-64 0 512 512" width="20" xmlns="http://www.w3.org/2000/svg"><path d="m336 512h-288c-26.453125 0-48-21.523438-48-48v-224c0-26.476562 21.546875-48 48-48h288c26.453125 0 48 21.523438 48 48v224c0 26.476562-21.546875 48-48 48zm-288-288c-8.8125 0-16 7.167969-16 16v224c0 8.832031 7.1875 16 16 16h288c8.8125 0 16-7.167969 16-16v-224c0-8.832031-7.1875-16-16-16zm0 0"></path><path d="m304 224c-8.832031 0-16-7.167969-16-16v-80c0-52.929688-43.070312-96-96-96s-96 43.070312-96 96v80c0 8.832031-7.167969 16-16 16s-16-7.167969-16-16v-80c0-70.59375 57.40625-128 128-128s128 57.40625 128 128v80c0 8.832031-7.167969 16-16 16zm0 0"></path></svg>
      <input type="password" class="input" placeholder="Escribe tu contraseña">
    </div>

    <div class="flex-row">
      <div>
        <input type="checkbox" id="remember-me">
        <label for="remember-me">Recuérdame</label>
      </div>
      <span class="span">¿Olvidaste tu contraseña?</span>
    </div>

    <button type="submit" class="button-submit">Iniciar sesión</button>
    <p class="login-error" id="login-error"></p>

    <p class="p">¿No tienes cuenta? <a href="../register/register.html" class="span">Regístrate</a></p>
  </form>
</section>

<!-- ============================================================
     FOOTER — inyectado por global.js

<div id="site-dashboard-footer"></div>

</html>
